name: Prayer Times

on:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "Europe/Stockholm"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: "check"
        type: choice
        options:
          - check
          - test_notification

permissions:
  contents: write

concurrency:
  group: prayer-times-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test notification
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test_notification'
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: python -m src.main test_notification

      - name: Check prayer time
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'check'
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: python -m src.main check --send
